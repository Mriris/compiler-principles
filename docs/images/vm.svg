<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 中间代码区 -->
  <text x="145" y="44" text-anchor="middle" font-size="12" fill="#334155">中间代码区 code[]</text>
  <rect x="30" y="55" width="230" height="320" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="58" y="167" width="180" height="22" fill="#fef9c3" stroke="#eab308"/>
  <g font-family="Consolas,monospace" font-size="12" fill="#0f172a">
    <text x="70" y="89">0   BR    24</text>
    <text x="70" y="113">1   ENTER 6</text>
    <text x="70" y="137">2   STO   6</text>
    <text x="70" y="161">3   STO   5</text>
    <text x="70" y="183">4   LOAD  5</text>
    <text x="70" y="209">5   LOAD  6</text>
    <text x="70" y="233">6   ADD</text>
    <text x="70" y="257">7   STO   7</text>
    <text x="70" y="281">8   LOADI 111</text>
    <text x="70" y="305">9   STO   3</text>
    <text x="70" y="329">10  LOAD  7</text>
    <text x="70" y="353">11  RETURN</text>
  </g>
  <line x1="10" y1="178" x2="54" y2="178" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="18" y="168" font-size="12" fill="#dc2626">ip</text>
  <text x="30" y="404" font-size="11" fill="#475569">BR L:ip = L(无条件转移)</text>
  <text x="30" y="422" font-size="11" fill="#475569">BRF L:栈顶为假(0)时 ip = L</text>

  <!-- 操作数栈 -->
  <text x="420" y="120" text-anchor="middle" font-size="12" fill="#334155">操作数栈 optStack</text>
  <rect x="350" y="140" width="140" height="34" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="420" y="162" text-anchor="middle" font-size="12" fill="#0c4a6e">33</text>
  <rect x="350" y="174" width="140" height="34" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="420" y="196" text-anchor="middle" font-size="12" fill="#0c4a6e">22</text>
  <rect x="350" y="208" width="140" height="34" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="322" y1="157" x2="348" y2="157" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="318" y="161" text-anchor="end" font-size="11" fill="#475569">栈顶</text>
  <text x="420" y="272" text-anchor="middle" font-size="11" fill="#475569">ADD / SUB / MULT / DIV / 比较 / 逻辑运算:</text>
  <text x="420" y="290" text-anchor="middle" font-size="11" fill="#475569">弹出栈顶两单元运算,结果压回栈顶</text>

  <!-- LOADI:代码区到操作数栈 -->
  <line x1="262" y1="220" x2="346" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="240" text-anchor="middle" font-size="11" fill="#475569">LOADI:常量入栈</text>

  <!-- 变量存储区 -->
  <text x="720" y="44" text-anchor="middle" font-size="12" fill="#334155">变量存储区 stack[](绝对地址)</text>
  <g font-size="11">
    <rect x="640" y="55" width="160" height="26" fill="#ffffff" stroke="#94a3b8"/>
    <text x="630" y="72" text-anchor="end" fill="#64748b">0</text>
    <text x="720" y="72" text-anchor="middle" fill="#64748b">(保留)</text>
    <rect x="640" y="81" width="160" height="26" fill="#ffffff" stroke="#94a3b8"/>
    <text x="630" y="98" text-anchor="end" fill="#64748b">1</text>
    <text x="720" y="98" text-anchor="middle" fill="#64748b">(保留)</text>
    <rect x="640" y="107" width="160" height="26" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="630" y="124" text-anchor="end" fill="#64748b">2</text>
    <text x="720" y="124" text-anchor="middle" fill="#14532d">all1</text>
    <rect x="640" y="133" width="160" height="26" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="630" y="150" text-anchor="end" fill="#64748b">3</text>
    <text x="720" y="150" text-anchor="middle" fill="#14532d">all2</text>
    <rect x="640" y="159" width="160" height="26" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="630" y="176" text-anchor="end" fill="#64748b">4</text>
    <text x="720" y="176" text-anchor="middle" fill="#14532d">all3</text>
    <rect x="640" y="185" width="160" height="26" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="630" y="202" text-anchor="end" fill="#64748b">5</text>
    <text x="720" y="202" text-anchor="middle" fill="#14532d">a</text>
  </g>

  <!-- LOAD / STO -->
  <line x1="638" y1="120" x2="492" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="118" text-anchor="middle" font-size="11" fill="#475569">LOAD D:取变量入栈</text>
  <line x1="492" y1="185" x2="638" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="215" text-anchor="middle" font-size="11" fill="#475569">STO D:栈顶存入变量</text>

  <!-- 函数调用栈 -->
  <text x="720" y="292" text-anchor="middle" font-size="12" fill="#334155">函数调用栈 funStack</text>
  <rect x="640" y="302" width="160" height="32" fill="#fdf4ff" stroke="#a855f7"/>
  <text x="720" y="323" text-anchor="middle" font-size="11" fill="#6b21a8">返回地址:24</text>
  <rect x="640" y="334" width="160" height="32" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="720" y="392" text-anchor="middle" font-size="11" fill="#475569">CAL f:压入返回地址,ip = 函数入口</text>
  <text x="720" y="410" text-anchor="middle" font-size="11" fill="#475569">RETURN:ip = 弹出的返回地址</text>

  <!-- IN / OUT -->
  <text x="420" y="392" text-anchor="middle" font-size="11" fill="#475569">IN:键盘读入整数压栈(read)</text>
  <text x="420" y="410" text-anchor="middle" font-size="11" fill="#475569">OUT:弹出栈顶输出到屏幕(write)</text>
</svg>
