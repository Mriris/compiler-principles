<svg xmlns="http://www.w3.org/2000/svg" width="940" height="345" viewBox="0 0 940 345" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="345" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 第一行:源程序 -> 词法分析 -> 单词流 -> 语法分析 -> 语法树 -->
  <rect x="16" y="42" width="118" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="75" y="66" text-anchor="middle" font-size="13" fill="#0f172a">TEST 源程序</text>
  <text x="75" y="84" text-anchor="middle" font-size="11" fill="#64748b">TESTin*.txt</text>
  <line x1="134" y1="70" x2="166" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="168" y="42" width="150" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="243" y="66" text-anchor="middle" font-size="13" fill="#1e3a8a">实验一:词法分析</text>
  <text x="243" y="84" text-anchor="middle" font-size="11" fill="#1e40af">表驱动 DFA</text>
  <line x1="318" y1="70" x2="366" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="368" y="42" width="112" height="56" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="424" y="66" text-anchor="middle" font-size="13" fill="#0f172a">Testout.txt</text>
  <text x="424" y="84" text-anchor="middle" font-size="11" fill="#64748b">行号 种别 值</text>
  <line x1="480" y1="70" x2="528" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="530" y="42" width="150" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="605" y="66" text-anchor="middle" font-size="13" fill="#1e3a8a">实验二:语法分析</text>
  <text x="605" y="84" text-anchor="middle" font-size="11" fill="#1e40af">递归下降</text>
  <line x1="680" y1="70" x2="728" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="730" y="42" width="130" height="56" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="795" y="66" text-anchor="middle" font-size="13" fill="#0f172a">Treeout.txt</text>
  <text x="795" y="84" text-anchor="middle" font-size="11" fill="#64748b">缩进语法树</text>

  <!-- 实验二到实验三:同一递归下降框架 -->
  <polyline points="605,98 605,155 270,155 270,208" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="148" text-anchor="middle" font-size="11" fill="#475569">共用递归下降框架,嵌入语义动作</text>

  <!-- 第二行:语义分析 -> 中间代码 -> 虚拟机 -> 运行结果 -->
  <rect x="168" y="210" width="204" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="270" y="234" text-anchor="middle" font-size="13" fill="#1e3a8a">实验三:语义分析·中间代码</text>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#1e40af">语法制导翻译 + 符号表</text>
  <line x1="372" y1="238" x2="420" y2="238" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="422" y="210" width="130" height="56" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="487" y="234" text-anchor="middle" font-size="13" fill="#0f172a">Parseout.txt</text>
  <text x="487" y="252" text-anchor="middle" font-size="11" fill="#64748b">操作码 + 操作数</text>
  <line x1="552" y1="238" x2="600" y2="238" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="602" y="210" width="150" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="677" y="234" text-anchor="middle" font-size="13" fill="#1e3a8a">实验四:虚拟机</text>
  <text x="677" y="252" text-anchor="middle" font-size="11" fill="#1e40af">栈式解释执行</text>
  <line x1="752" y1="238" x2="800" y2="238" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="802" y="210" width="120" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="862" y="234" text-anchor="middle" font-size="13" fill="#14532d">运行结果</text>
  <text x="862" y="252" text-anchor="middle" font-size="11" fill="#15803d">read / write</text>

  <text x="470" y="322" text-anchor="middle" font-size="11" fill="#64748b">实验三读取实验一生成的单词流 Testout.txt,在语法分析的同时完成语义检查并生成栈式指令</text>
</svg>
