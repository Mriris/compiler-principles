<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="360" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- 起点与 note0 -->
  <line x1="20" y1="175" x2="54" y2="175" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="80" cy="175" r="24" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="180" text-anchor="middle" font-size="12" fill="#0f172a">S0</text>
  <line x1="104" y1="175" x2="204" y2="175" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="154" y="165" text-anchor="middle" font-size="12" fill="#334155">/</text>
  <circle cx="230" cy="175" r="24" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="180" text-anchor="middle" font-size="11" fill="#0f172a">note0</text>

  <!-- 单行注释 // -->
  <line x1="252" y1="166" x2="418" y2="95" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="115" text-anchor="middle" font-size="11" fill="#334155">/(单行注释)</text>
  <circle cx="440" cy="85" r="24" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="90" text-anchor="middle" font-size="11" fill="#0f172a">note4</text>
  <path d="M 426 64 C 410 28, 470 28, 454 64" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="20" text-anchor="middle" font-size="11" fill="#334155">非换行字符</text>
  <line x1="464" y1="85" x2="624" y2="85" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="544" y="73" text-anchor="middle" font-size="11" fill="#334155">换行</text>
  <circle cx="650" cy="85" r="24" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="650" cy="85" r="18" fill="none" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="650" y="90" text-anchor="middle" font-size="11" fill="#312e81">行尾</text>
  <text x="650" y="126" text-anchor="middle" font-size="11" fill="#64748b">整段丢弃,回到 S0</text>

  <!-- 多行注释 /* ... */ -->
  <line x1="252" y1="184" x2="418" y2="255" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="237" text-anchor="middle" font-size="11" fill="#334155">*(多行注释)</text>
  <circle cx="440" cy="265" r="24" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="440" y="270" text-anchor="middle" font-size="11" fill="#0f172a">note1</text>
  <path d="M 419 244 C 383 228, 383 302, 419 286" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="269" text-anchor="end" font-size="11" fill="#334155">非 * 字符</text>

  <line x1="464" y1="265" x2="576" y2="265" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="255" text-anchor="middle" font-size="12" fill="#334155">*</text>
  <circle cx="600" cy="265" r="24" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#0f172a">note2</text>
  <path d="M 586 244 C 570 208, 630 208, 614 244" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="200" text-anchor="middle" font-size="12" fill="#334155">*</text>
  <path d="M 588 286 C 555 322, 505 322, 466 282" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="528" y="325" text-anchor="middle" font-size="11" fill="#334155">其他</text>

  <line x1="624" y1="265" x2="726" y2="265" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="675" y="255" text-anchor="middle" font-size="12" fill="#334155">/</text>
  <circle cx="750" cy="265" r="24" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="750" cy="265" r="18" fill="none" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="750" y="270" text-anchor="middle" font-size="11" fill="#312e81">note3</text>
  <text x="750" y="308" text-anchor="middle" font-size="11" fill="#64748b">注释结束,丢弃</text>

  <!-- 出错说明 -->
  <text x="660" y="165" text-anchor="middle" font-size="11" fill="#dc2626">note1 中读到文件尾:报“未查找到注释尾”</text>
  <text x="660" y="183" text-anchor="middle" font-size="11" fill="#dc2626">检测到注释嵌套同样报错</text>
</svg>
